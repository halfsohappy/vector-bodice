<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>automated pattern block generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;500;700&family=Playwrite+DE+Grund:wght@400&display=swap" rel="stylesheet">
  <style>
    /* =============================================
       automated pattern block generator
       Design language: Gooey / Annabel Portfolio
       Light / Dark · Martian Mono · Playwrite DE Grund
       ============================================= */

    :root {
      --bg:            #ffffff;
      --bg-alt:        #f4f5f6;
      --bg-card:       #ffffff;
      --bg-input:      #f9fafb;
      --bg-hover:      #eef0f3;
      --border:        #dddddd;
      --border-focus:  #90849c;
      --text-dark:     #2A2F36;
      --text-medium:   #6C7A89;
      --text-light:    #ABB7B7;
      --accent:        #90849c;
      --accent-hover:  #7a6f8a;
      --accent-dim:    rgba(144,132,156,0.12);
      --header-bg:     #DAC7FF;
      --header-text:   #2A2F36;
      --btn-pri-bg:    #4a5568;
      --btn-pri-hover: #3d4659;
      --btn-pri-text:  #ffffff;
      --success:       #4caf50;
      --danger:        #d64541;
      --shadow:        0 1px 4px rgba(0,0,0,.06);
      --radius:        6px;
      --radius-lg:     12px;
      --font:          'Martian Mono', monospace;
      --font-title:    'Playwrite DE Grund', serif;
    }

    :root.dark {
      --bg:            #1a1d21;
      --bg-alt:        #141618;
      --bg-card:       #1f2227;
      --bg-input:      #252a31;
      --bg-hover:      #2a2f38;
      --border:        #2e3540;
      --border-focus:  #a898b8;
      --text-dark:     #e8eaed;
      --text-medium:   #8c9bb0;
      --text-light:    #4a5568;
      --accent:        #a898b8;
      --accent-hover:  #b8a8cc;
      --accent-dim:    rgba(168,152,184,0.12);
      --header-bg:     #1e1628;
      --header-text:   #e8eaed;
      --btn-pri-bg:    #90849c;
      --btn-pri-hover: #a898b8;
      --btn-pri-text:  #ffffff;
      --shadow:        0 1px 6px rgba(0,0,0,.30);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      font-size: 14px;
      font-weight: 300;
      color: var(--text-dark);
      background: var(--bg-alt);
      line-height: 1.6;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ──────────────────────────────────── */
    .main-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 50px;
      flex-shrink: 0;
      background: var(--header-bg);
      border-bottom: 1px solid rgba(0,0,0,.08);
    }
    .header-brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .brand-name {
      font-family: var(--font-title);
      font-size: 21px;
      font-weight: 400;
      color: var(--header-text);
      letter-spacing: -.01em;
    }
    .brand-sub {
      font-family: var(--font);
      font-size: 10px;
      font-weight: 400;
      color: var(--header-text);
      opacity: .55;
      letter-spacing: .02em;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 99px;
      background: rgba(0,0,0,.07);
      font-size: 10px;
      color: var(--header-text);
      opacity: .9;
      transition: background .15s;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--text-light);
      transition: background .3s;
    }
    .status-dot.loading { background: #e3bb7f; animation: pulse 1.2s infinite; }
    .status-dot.ready   { background: var(--success); box-shadow: 0 0 5px rgba(76,175,80,.5); }
    .status-dot.error   { background: var(--danger); }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

    .btn-theme {
      font-family: var(--font);
      font-size: 11px;
      padding: 5px 11px;
      border: 1px solid rgba(0,0,0,.15);
      border-radius: var(--radius);
      background: rgba(0,0,0,.06);
      color: var(--header-text);
      cursor: pointer;
      transition: background .15s;
    }
    .btn-theme:hover { background: rgba(0,0,0,.12); }

    /* ── App layout ──────────────────────────────── */
    .app-layout {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Left panel ──────────────────────────────── */
    .panel-left {
      width: 310px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--header-bg);
      border-right: 1px solid rgba(0,0,0,.08);
    }
    .panel-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 13px;
      scrollbar-width: none;
    }
    .panel-scroll::-webkit-scrollbar { display: none; }

    /* ── Cards ───────────────────────────────────── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 15px;
      margin-bottom: 11px;
      box-shadow: var(--shadow);
    }
    .card h2 {
      font-family: var(--font-title);
      font-size: 15px;
      font-weight: 400;
      color: var(--text-dark);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .hint-text {
      font-size: 10px;
      color: var(--text-medium);
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }
    .card-header h2 {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }
    .btn-sm {
      font-size: 11px;
      font-weight: 400;
      padding: 4px 11px;
      border-radius: 99px;
    }
    .size-tag {
      display: none;
      font-size: 10px;
      color: var(--accent);
      background: var(--accent-dim);
      border-radius: 99px;
      padding: 1px 7px;
      vertical-align: middle;
      margin-left: 5px;
    }
    .size-tag.visible { display: inline; }

    /* ── Form ────────────────────────────────────── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px 11px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .form-group label {
      font-size: 9px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-medium);
    }
    .form-group input[type="number"] {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 400;
      padding: 6px 9px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-input);
      color: var(--text-dark);
      outline: none;
      width: 100%;
      transition: border-color .15s, background .15s;
    }
    .form-group input[type="number"]:focus {
      border-color: var(--border-focus);
      background: var(--bg-card);
    }
    .form-group input[type="number"]::-webkit-inner-spin-button { opacity: .3; }

    .form-group select {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 400;
      padding: 6px 9px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-input);
      color: var(--text-dark);
      outline: none;
      width: 100%;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .form-group select:focus {
      border-color: var(--border-focus);
      background: var(--bg-card);
    }

    .form-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 11px 0;
    }

    /* Seam allowance presets */
    .sa-presets {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .sa-pill {
      font-family: var(--font);
      font-size: 13px;
      padding: 7px 18px;
      border: 1px solid var(--border);
      border-radius: 99px;
      background: var(--bg-input);
      color: var(--text-medium);
      cursor: pointer;
      transition: all .12s;
    }
    .sa-pill:hover { border-color: var(--accent); color: var(--accent); }
    .sa-pill.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 500;
    }

    /* Checkbox */
    .cb-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 8px 0 4px;
    }
    .cb-row input[type="checkbox"] {
      width: 14px; height: 14px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .cb-row label {
      font-size: 12px;
      color: var(--text-medium);
      cursor: pointer;
    }

    /* Buttons */
    .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      padding: 9px 18px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary {
      background: var(--btn-pri-bg);
      color: var(--btn-pri-text);
      border-color: var(--btn-pri-bg);
      flex: 1;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--btn-pri-hover);
      border-color: var(--btn-pri-hover);
      box-shadow: 0 2px 8px rgba(74,85,104,.28);
    }
    .btn-secondary {
      background: var(--bg);
      color: var(--text-medium);
      border-color: var(--border);
    }
    .btn-secondary:hover:not(:disabled) {
      background: var(--bg-hover);
      color: var(--text-dark);
    }
    .btn-accent {
      background: transparent;
      color: var(--accent);
      border-color: var(--accent);
    }
    .btn-accent:hover:not(:disabled) { background: var(--accent-dim); }

    /* ── Right panel ─────────────────────────────── */
    .panel-right {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-alt);
    }

    /* Tabs */
    .tabs {
      display: flex;
      padding: 8px 16px 0;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 2px;
    }
    .tab {
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      padding: 7px 18px;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--text-medium);
      cursor: pointer;
      transition: all .12s;
      margin-bottom: -1px;
    }
    .tab:hover { color: var(--text-dark); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Error banner */
    .error-banner {
      display: none;
      margin: 10px 14px 0;
      padding: 9px 13px;
      background: rgba(214,69,65,.07);
      border: 1px solid rgba(214,69,65,.3);
      border-radius: var(--radius);
      font-size: 11px;
      color: var(--danger);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .error-banner.visible { display: block; }

    /* Preview area */
    .preview-area {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .preview-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      height: 100%;
      min-height: 280px;
      color: var(--text-light);
    }
    .placeholder-icon { font-size: 44px; opacity: .25; }
    .placeholder-text { font-size: 12px; color: var(--text-light); }

    .spinner {
      width: 30px; height: 30px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .75s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .svg-container {
      max-width: 100%;
      width: 100%;
    }
    .svg-container svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: var(--radius);
      box-shadow: 0 2px 14px rgba(0,0,0,.09);
    }

    /* Download bar */
    .download-bar {
      display: none;
      padding: 9px 14px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      gap: 7px;
      flex-shrink: 0;
      align-items: center;
    }
    .download-bar.visible { display: flex; }
    .dl-spacer { flex: 1; }

    /* Responsive */
    @media (max-width: 680px) {
      .app-layout { flex-direction: column; }
      .panel-left  { width: 100%; max-height: 50dvh; border-right: none; border-bottom: 1px solid var(--border); }

      /* Header: subtitle wraps below title on narrow screens */
      .main-header { padding: 0 12px; height: auto; min-height: 50px; padding-top: 7px; padding-bottom: 7px; align-items: flex-start; }
      .header-brand { flex-direction: column; align-items: flex-start; gap: 2px; }
      .brand-sub { display: block; white-space: normal; font-size: 9px; }
      .header-right { margin-top: 4px; align-self: flex-start; }

      /* Larger tap targets for inputs */
      .form-group label { font-size: 10px; }
      .form-group input[type="number"] { font-size: 15px; padding: 9px 10px; }

      /* Bigger SA pill touch area */
      .sa-pill { padding: 10px 15px; }

      /* Bigger checkbox tap zone */
      .cb-row input[type="checkbox"] { width: 18px; height: 18px; }
      .cb-row label { font-size: 13px; }
      .cb-row { margin: 10px 0 5px; }

      /* Taller primary button */
      .btn { padding: 11px 18px; }

      /* Download bar: wrap and fill width */
      .download-bar { flex-wrap: wrap; }
      .dl-spacer { display: none; }
      .download-bar .btn { flex: 1 1 auto; }

      /* Tabs: larger touch target */
      .tab { padding: 10px 18px; }
    }

    /* Very small phones: single-column form grid */
    @media (max-width: 420px) {
      .form-grid { grid-template-columns: 1fr; }
      .brand-name { font-size: 17px; }
    }
  </style>
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="main-header">
    <div class="header-brand">
      <span class="brand-name">automated pattern block generator</span>
      <span class="brand-sub" id="brandSub">tool by annie lee</span>
    </div>
    <div class="header-right">
      <div class="status-pill">
        <span class="status-dot loading" id="statusDot"></span>
        <span id="statusLabel">loading…</span>
      </div>
      <button class="btn-theme" id="btnTheme" title="Toggle dark mode">◑</button>
    </div>
  </header>

  <!-- ===== App layout ===== -->
  <div class="app-layout">

    <!-- Left: inputs -->
    <div class="panel-left">
      <div class="panel-scroll">

        <div class="card">
          <h2>Pattern</h2>
          <div class="form-group">
            <select id="patternSelect" title="Choose which pattern to draft"></select>
          </div>
          <p class="hint-text" id="patternSource" style="margin:8px 0 0"></p>
        </div><!-- /card pattern -->

        <div class="card">
          <div class="card-header">
            <h2>Measurements</h2>
            <button class="btn btn-secondary btn-sm" id="btnRandom" title="Load a random size from the built-in test suite">⚄ random</button>
          </div>
          <p class="hint-text">All values in inches. Hover a label for guidance.<span id="sizeTag" class="size-tag"></span></p>
          <div id="measureFields"><!-- built from the pattern manifest --></div>
        </div><!-- /card measurements -->

        <div class="card">
          <h2>Options</h2>

          <div class="form-group" style="margin-bottom:5px">
            <label for="inp-seam">Seam allowance (in)</label>
            <input type="number" id="inp-seam" value="0.75" step="0.125" min="0" max="2" inputmode="decimal">
          </div>
          <div class="sa-presets" id="saPresets">
            <button class="sa-pill" data-sa="0">none</button>
            <button class="sa-pill" data-sa="0.375">⅜</button>
            <button class="sa-pill" data-sa="0.5">½</button>
            <button class="sa-pill" data-sa="0.625">⅝</button>
            <button class="sa-pill active" data-sa="0.75">¾</button>
            <button class="sa-pill" data-sa="1">1</button>
            <button class="sa-pill" data-sa="1.25">1¼</button>
          </div>

          <hr class="form-divider">

          <div id="patternOptions"><!-- built from the pattern manifest --></div>

          <div class="cb-row">
            <input type="checkbox" id="inp-white">
            <label for="inp-white">white fill</label>
          </div>

          <div class="btn-row">
            <button class="btn btn-primary" id="btnGenerate" disabled>Generate →</button>
          </div>
        </div><!-- /card options -->

      </div><!-- /panel-scroll -->
    </div><!-- /panel-left -->

    <!-- Right: preview -->
    <div class="panel-right">

      <div class="tabs" id="tabs"><!-- one tab per pattern piece, from the manifest --></div>

      <div class="error-banner" id="errorBanner"></div>

      <div class="preview-area" id="previewArea">
        <div class="preview-placeholder" id="previewPlaceholder">
          <div class="spinner" id="loadingSpinner"></div>
          <span class="placeholder-text" id="placeholderText">Loading Python runtime…</span>
        </div>
        <div id="svgViews" style="display:contents"><!-- one container per piece --></div>
      </div>

      <div class="download-bar" id="downloadBar">
        <span id="dlButtons" style="display:contents"><!-- one button per piece --></span>
        <span class="dl-spacer"></span>
        <button class="btn btn-secondary" id="btnDlCombined">↓ Combined SVG</button>
      </div>

    </div><!-- /panel-right -->
  </div><!-- /app-layout -->

  <!-- Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.3/full/pyodide.js"></script>
  <script>
    /* ── Theme ───────────────────────────────────────────────────────────── */
    (function () {
      if (localStorage.getItem('vb-theme') === 'dark')
        document.documentElement.classList.add('dark');
    })();
    document.getElementById('btnTheme').addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('vb-theme', dark ? 'dark' : 'light');
    });

    /* ── State ───────────────────────────────────────────────────────────── */
    let pyodide        = null;
    let pyodideReady   = false;
    let PATTERNS       = {};      // pattern id → manifest
    let currentPattern = null;    // manifest of the selected pattern
    let svgData        = {};      // piece id → svg string (last generation)
    let svgDims        = {};      // piece id → [w_in, h_in]
    let activeTab      = null;    // piece id

    const $ = id => document.getElementById(id);

    /* ── Helpers ─────────────────────────────────────────────────────────── */
    function setStatus(label, state) {
      $('statusDot').className     = 'status-dot ' + state;
      $('statusLabel').textContent = label;
    }

    function showTab(tab) {
      activeTab = tab;
      for (const piece of currentPattern.pieces)
        $('svg-' + piece.id).style.display = piece.id === tab ? 'block' : 'none';
      document.querySelectorAll('#tabs .tab').forEach(b =>
        b.classList.toggle('active', b.dataset.tab === tab));
    }

    function downloadSVG(svgStr, filename) {
      const blob = new Blob([svgStr], { type: 'image/svg+xml' });
      const url  = URL.createObjectURL(blob);
      const a    = Object.assign(document.createElement('a'), { href: url, download: filename });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function el(tag, attrs = {}, children = []) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'text') node.textContent = v;
        else if (v !== undefined && v !== null) node.setAttribute(k, v);
      }
      for (const c of children) node.appendChild(c);
      return node;
    }

    /* ── Pattern UI (built from the manifest) ────────────────────────────── */
    function buildMeasurementFields(p) {
      const root = $('measureFields');
      root.innerHTML = '';
      p.measurementGroups.forEach((grp, gi) => {
        if (gi > 0) root.appendChild(el('hr', { class: 'form-divider' }));
        if (grp.hint) root.appendChild(el('p', { class: 'hint-text', text: grp.hint }));
        const grid = el('div', { class: 'form-grid' });
        for (const f of grp.fields) {
          const label = el('label', { for: 'inp-' + f.key, title: f.title, text: f.label });
          const input = el('input', {
            type: 'number', id: 'inp-' + f.key, step: f.step, min: f.min,
            max: f.max, inputmode: 'decimal',
          });
          if (grp.required) input.value = f.default ?? '';
          else input.placeholder = '—';
          grid.appendChild(el('div', { class: 'form-group' }, [label, input]));
        }
        root.appendChild(grid);
      });
    }

    function buildPatternOptions(p) {
      const root = $('patternOptions');
      root.innerHTML = '';
      for (const opt of p.options || []) {
        const cb = el('input', { type: 'checkbox', id: 'inp-' + opt.key });
        cb.checked = !!opt.default;
        const label = el('label', { for: 'inp-' + opt.key, text: opt.label });
        root.appendChild(el('div', { class: 'cb-row' }, [cb, label]));
      }
    }

    function buildPieceViews(p) {
      $('tabs').innerHTML     = '';
      $('svgViews').innerHTML = '';
      $('dlButtons').innerHTML = '';
      p.pieces.forEach((piece, i) => {
        $('tabs').appendChild(el('button', {
          class: 'tab' + (i === 0 ? ' active' : ''),
          'data-tab': piece.id, text: piece.label,
        }));
        const view = el('div', { class: 'svg-container', id: 'svg-' + piece.id });
        view.style.display = 'none';
        $('svgViews').appendChild(view);
        const btn = el('button', { class: 'btn btn-accent', id: 'dl-' + piece.id,
                                   text: '↓ ' + piece.label });
        btn.addEventListener('click', () => {
          if (!svgData[piece.id]) return;
          const [w, h] = svgDims[piece.id];
          downloadSVG(svgData[piece.id], dlFilename(piece.id, w, h));
        });
        $('dlButtons').appendChild(btn);
      });
      activeTab = p.pieces.length ? p.pieces[0].id : null;
    }

    function selectPattern(id) {
      currentPattern = PATTERNS[id];
      $('patternSource').textContent = currentPattern.source || '';
      buildMeasurementFields(currentPattern);
      buildPatternOptions(currentPattern);
      buildPieceViews(currentPattern);
      $('btnRandom').style.display =
        (currentPattern.testSizes || []).length ? '' : 'none';
      $('sizeTag').classList.remove('visible');
      // reset preview
      svgData = {}; svgDims = {};
      $('downloadBar').classList.remove('visible');
      $('errorBanner').classList.remove('visible');
      $('previewPlaceholder').style.display = 'flex';
      if (pyodideReady) {
        $('loadingSpinner').style.display = 'none';
        $('placeholderText').textContent = 'Enter measurements and click Generate.';
      }
    }

    /* ── Tabs (delegated — tabs are rebuilt per pattern) ─────────────────── */
    $('tabs').addEventListener('click', e => {
      const btn = e.target.closest('.tab');
      if (btn) showTab(btn.dataset.tab);
    });

    /* ── Seam allowance presets ──────────────────────────────────────────── */
    const seam = $('inp-seam');
    $('saPresets').addEventListener('click', e => {
      const pill = e.target.closest('.sa-pill');
      if (!pill) return;
      seam.value = pill.dataset.sa;
      document.querySelectorAll('.sa-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
    });
    seam.addEventListener('input', () => {
      document.querySelectorAll('.sa-pill').forEach(p =>
        p.classList.toggle('active', p.dataset.sa === seam.value));
    });

    /* ── Manifest loading ────────────────────────────────────────────────── */
    async function fetchJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${url} fetch failed (${r.status})`);
      return r.json();
    }

    async function loadPatterns() {
      const index = await fetchJSON('./patterns/index.json');
      for (const id of index.patterns)
        PATTERNS[id] = await fetchJSON(`./patterns/${id}/manifest.json`);
      const sel = $('patternSelect');
      sel.innerHTML = '';
      for (const p of Object.values(PATTERNS))
        sel.appendChild(el('option', { value: p.id, text: p.name }));
      sel.addEventListener('change', () => selectPattern(sel.value));
      selectPattern(index.patterns[0]);
    }

    /* ── Pyodide init ────────────────────────────────────────────────────── */
    async function initPyodide() {
      setStatus('loading runtime…', 'loading');

      pyodide = await loadPyodide({
        indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.27.3/full/'
      });

      setStatus('loading numpy…', 'loading');
      await pyodide.loadPackage('numpy');

      setStatus('loading pattern library…', 'loading');
      const files = ['render.py', 'geometry.py', 'patterns/__init__.py'];
      for (const p of Object.values(PATTERNS))
        for (const f of p.files) files.push(`patterns/${p.id}/${f}`);
      const sources = await Promise.all(files.map(f =>
        fetch(`./${f}`).then(r => {
          if (!r.ok) throw new Error(`${f} fetch failed (${r.status})`);
          return r.text();
        })
      ));

      for (const id of Object.keys(PATTERNS))
        pyodide.FS.mkdirTree(`/home/pyodide/patterns/${id}`);
      files.forEach((f, i) =>
        pyodide.FS.writeFile(`/home/pyodide/${f}`, sources[i]));

      await pyodide.runPythonAsync(`
import sys, importlib
sys.path.insert(0, '/home/pyodide')
import render
for _pattern_id in ${JSON.stringify(Object.keys(PATTERNS))}:
    importlib.import_module('patterns.' + _pattern_id)
      `);

      pyodideReady = true;
      setStatus('ready', 'ready');
      $('btnGenerate').disabled = false;
      $('loadingSpinner').style.display = 'none';
      $('placeholderText').textContent = 'Enter measurements and click Generate.';
    }

    /* ── Generate ────────────────────────────────────────────────────────── */
    function collectParams(p) {
      const params = {};
      const errors = [];
      for (const grp of p.measurementGroups) {
        const vals = {};
        for (const f of grp.fields) {
          const raw = $('inp-' + f.key).value.trim();
          const v   = parseFloat(raw);
          if (raw !== '' && !isNaN(v)) vals[f.key] = v;
        }
        const filled = Object.keys(vals).length;
        if (!grp.required && filled === 0) continue;
        if (filled < grp.fields.length) {
          const missing = grp.fields.filter(f => !(f.key in vals))
                                    .map(f => f.label.toLowerCase());
          errors.push(grp.required
            ? `Invalid value for ${missing.join(', ')}`
            : `${grp.label} measurements are optional, but fill in either all or none (missing: ${missing.join(', ')})`);
          continue;
        }
        const bad = grp.fields.filter(f => vals[f.key] < 0)
                              .map(f => f.label.toLowerCase());
        if (bad.length) { errors.push(`Invalid value for ${bad.join(', ')}`); continue; }
        Object.assign(params, vals);
      }
      for (const opt of p.options || [])
        params[opt.key] = $('inp-' + opt.key).checked;
      const sa = parseFloat($('inp-seam').value || '0');
      if (isNaN(sa) || sa < 0) errors.push('Invalid value for seam allowance');
      else params.seam_allowance = sa;
      params.white_fill = $('inp-white').checked;
      return { params, errors };
    }

    async function generate() {
      const btn = $('btnGenerate');
      btn.disabled = true;
      btn.textContent = 'Generating…';

      const errorBanner = $('errorBanner');
      errorBanner.classList.remove('visible');

      $('previewPlaceholder').style.display = 'flex';
      $('loadingSpinner').style.display = 'block';
      $('placeholderText').textContent = 'Generating pattern…';
      for (const piece of currentPattern.pieces)
        $('svg-' + piece.id).style.display = 'none';
      $('downloadBar').classList.remove('visible');
      setStatus('generating…', 'loading');

      try {
        const { params, errors } = collectParams(currentPattern);
        if (errors.length) throw new Error(errors.join('\n'));

        // Every pattern module exposes render_web(params) → {piece_id: svg, …}
        pyodide.globals.set('_params_json', JSON.stringify(params));
        const pyResult = await pyodide.runPythonAsync(`
import json, importlib
_mod = importlib.import_module('patterns.${currentPattern.id}')
json.dumps(_mod.render_web(json.loads(_params_json)))
        `);
        const result = JSON.parse(pyResult);

        // Strip @import and explicit px dimensions so viewBox drives scaling
        const clean = s => s
          .replace(/<style[^>]*>@import[^<]*<\/style>/gi, '')
          .replace(/(<svg[^>]*?)\s+width="\d+"/, '$1')
          .replace(/(<svg[^>]*?)\s+height="\d+"/, '$1');

        svgData = {}; svgDims = {};
        for (const piece of currentPattern.pieces) {
          const has = !!result[piece.id];
          if (has) {
            svgData[piece.id] = result[piece.id];
            svgDims[piece.id] = [result[piece.id + '_w'], result[piece.id + '_h']];
            $('svg-' + piece.id).innerHTML = clean(result[piece.id]);
          } else {
            $('svg-' + piece.id).innerHTML = '';
          }
          document.querySelector(`#tabs .tab[data-tab="${piece.id}"]`)
            .style.display = has ? '' : 'none';
          $('dl-' + piece.id).style.display = has ? '' : 'none';
        }
        $('btnDlCombined').style.display =
          Object.keys(svgData).length > 1 ? '' : 'none';
        if (!svgData[activeTab]) {
          const firstWithSvg = currentPattern.pieces.find(pc => svgData[pc.id]);
          activeTab = firstWithSvg ? firstWithSvg.id : null;
        }

        $('previewPlaceholder').style.display = 'none';
        $('downloadBar').classList.add('visible');
        if (activeTab) showTab(activeTab);
        setStatus('ready', 'ready');

      } catch (err) {
        errorBanner.textContent = '⚠ ' + (err.message || String(err));
        errorBanner.classList.add('visible');
        $('loadingSpinner').style.display = 'none';
        $('placeholderText').textContent = 'Generation failed.';
        setStatus('error', 'error');
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate →';
      }
    }

    $('btnGenerate').addEventListener('click', generate);

    // Enter key in any number input triggers generate (delegated — the
    // measurement fields are rebuilt when the pattern changes)
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.matches('input[type="number"]') &&
          !$('btnGenerate').disabled)
        generate();
    });

    /* ── Downloads ───────────────────────────────────────────────────────── */
    const DL_DPI = 300;
    function dlFilename(piece, w, h) {
      return `${currentPattern.id}_block_${piece}_${w}x${h}.svg`;
    }
    function buildCombinedSVG(pieceIds) {
      const GAP_IN = 0.5;
      const dims   = pieceIds.map(id => svgDims[id]);
      const totalW = dims.reduce((acc, [w]) => acc + w, 0)
                     + GAP_IN * (pieceIds.length - 1);
      const totalH = Math.max(...dims.map(([, h]) => h));
      // Strip the XML declaration from each piece — nested SVGs must not have it
      const strip = s => s.replace(/<\?xml[^?]*\?>\s*/i, '');
      const parts = [
        `<?xml version="1.0" encoding="UTF-8"?>`,
        `<svg xmlns="http://www.w3.org/2000/svg" width="${totalW * DL_DPI}" height="${totalH * DL_DPI}"`,
        `     viewBox="0 0 ${totalW * DL_DPI} ${totalH * DL_DPI}">`,
        `  <rect width="100%" height="100%" fill="white"/>`,
      ];
      let x = 0;
      for (const id of pieceIds) {
        const [w, h] = svgDims[id];
        const y = ((totalH - h) / 2) * DL_DPI;
        parts.push(
          `  <svg x="${x * DL_DPI}" y="${y}" width="${w * DL_DPI}" height="${h * DL_DPI}"`,
          `       viewBox="0 0 ${w * DL_DPI} ${h * DL_DPI}">`,
          strip(svgData[id]),
          `  </svg>`,
        );
        x += w + GAP_IN;
      }
      parts.push(`</svg>`);
      return { svg: parts.join('\n'), totalW, totalH };
    }
    $('btnDlCombined').addEventListener('click', () => {
      const ids = currentPattern.pieces.map(pc => pc.id).filter(id => svgData[id]);
      if (!ids.length) return;
      const { svg, totalW, totalH } = buildCombinedSVG(ids);
      downloadSVG(svg, dlFilename('combined', totalW, totalH));
    });

    /* ── Random size fill ────────────────────────────────────────────────── */
    const SA_VALUES = ['0', '0.375', '0.5', '0.625', '0.75', '1', '1.25'];
    let _lastRandIdx = -1;
    function randomFill() {
      const sizes = currentPattern.testSizes || [];
      if (!sizes.length) return;
      let idx;
      do { idx = Math.floor(Math.random() * sizes.length); }
      while (idx === _lastRandIdx && sizes.length > 1);
      _lastRandIdx = idx;
      const s = sizes[idx];
      for (const [key, val] of Object.entries(s.values)) {
        const inp = $('inp-' + key);
        if (inp) inp.value = val;
      }
      const tag = $('sizeTag');
      tag.textContent = s.label;
      tag.classList.add('visible');
      // pick a random seam allowance from the preset buttons
      const saVal = SA_VALUES[Math.floor(Math.random() * SA_VALUES.length)];
      $('inp-seam').value = saVal;
      document.querySelectorAll('.sa-pill').forEach(p =>
        p.classList.toggle('active', p.dataset.sa === saVal));
    }
    $('btnRandom').addEventListener('click', randomFill);
    // Clear size tag when user manually edits any measurement (delegated)
    $('measureFields').addEventListener('input', () =>
      $('sizeTag').classList.remove('visible'));

    /* ── Boot ────────────────────────────────────────────────────────────── */
    (async () => {
      try {
        await loadPatterns();   // manifests drive the form, tabs, and downloads
        await initPyodide();    // then load the runtime + pattern modules
      } catch (err) {
        setStatus('load failed', 'error');
        $('loadingSpinner').style.display = 'none';
        $('placeholderText').textContent = 'Failed to load: ' + err.message;
        console.error(err);
      }
    })();
  </script>
</body>
</html>
